name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # [semantic] is installed so the semantic tests run rather than skip;
      # none of them calls a model, they exercise the deterministic verifier.
      - name: Install
        run: pip install -e ".[semantic,dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  scorer-smoke:
    # Proves the CLI works end to end on a tiny fixture, with no network and no
    # dataset download: a broken entry point should fail here, not for a user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/selftest.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look for committed credentials
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|(api[_-]?key|secret|token)[\"'"'"']?\s*[:=]\s*[\"'"'"'][A-Za-z0-9._-]{16,})' -- . ':!*.lock'; then
            echo "::error::a credential-shaped literal is committed; keys belong in .env"
            exit 1
          fi
          echo "no credential-shaped literals found"
